<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630"><style>text{font-family:Arial,"PingFang SC",sans-serif}.k{font-size:13px;letter-spacing:2px;fill:#edaf63}.t{font-size:24px;font-weight:700;fill:#edf2e6}.s{font-size:17px;fill:#abc4c3}.label{font-size:18px;fill:#edf2e6}</style><rect width="1440" height="630" rx="22" fill="#10232a"/><text x="56" y="53" class="k">EMBERWORLD / CIRCUIT TO ACTION</text><text x="56" y="98" class="t">从链上参考电路，到可执行的队友决策</text><text x="56" y="132" class="s">X Layer reference netlists → local gate execution → ordinary inputs → authoritative game rules</text><rect x="56" y="181" width="309" height="180" rx="10" fill="#1c383c" stroke="#42605d"/><text x="78" y="215" class="k">01</text><text x="78" y="250" class="t">感知 / SENSE</text><text x="78" y="292" class="s">血量 · 距离 · 危险</text><text x="78" y="321" class="s">技能语义 · 冷却 · 能量</text><path d="M371 270h16m-6-6 6 6-6 6" fill="none" stroke="#eda45f" stroke-width="2"/><rect x="393" y="181" width="309" height="180" rx="10" fill="#1c383c" stroke="#42605d"/><text x="415" y="215" class="k">02</text><text x="415" y="250" class="t">编译 / COMPILE</text><text x="415" y="292" class="s">战术设置 + 技能装配</text><text x="415" y="321" class="s">比较 · 逻辑 · 优先级</text><path d="M708 270h16m-6-6 6 6-6 6" fill="none" stroke="#eda45f" stroke-width="2"/><rect x="730" y="181" width="309" height="180" rx="10" fill="#1c383c" stroke="#42605d"/><text x="752" y="215" class="k">03</text><text x="752" y="250" class="t">求值 / EXECUTE</text><text x="752" y="292" class="s">真实 NAND / LATCH</text><text x="752" y="321" class="s">每个角色独立状态</text><path d="M1045 270h16m-6-6 6 6-6 6" fill="none" stroke="#eda45f" stroke-width="2"/><rect x="1067" y="181" width="309" height="180" rx="10" fill="#1c383c" stroke="#42605d"/><text x="1089" y="215" class="k">04</text><text x="1089" y="250" class="t">行动 / ACT</text><text x="1089" y="292" class="s">技能 ID · 目标 · 移动</text><text x="1089" y="321" class="s">沿用原生合法操作</text><path d="M1210 374v35H720v24" fill="none" stroke="#eda45f" stroke-width="2"/><rect x="56" y="440" width="1320" height="132" rx="12" fill="#172d34" stroke="#59786d"/><text x="82" y="479" class="t">服务器核验 / SERVER AUTHORITY</text><text x="82" y="517" class="s">接受正常操作 · 重放规则与敌方行为 · 核对历史进度 · 权威掉落、结算与存档</text><text x="82" y="548" class="s">No full-game on-chain claim. No ZK proof or claimed proof of input provenance.</text></svg>